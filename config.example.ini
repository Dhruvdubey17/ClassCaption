# Copy to config.ini and change what you need. Command-line flags such as --backend cpu win over this file.

# coreml runs the encoder on the Neural Engine, metal on the GPU, cpu on the CPU only.
backend = coreml

live_model = models/ggml-large-v3-turbo-q5_0.bin
final_model = models/ggml-large-v3-q5_0.bin
vad_model = models/ggml-silero-v6.2.0.bin
language = en

# Speech probability (0 to 1) above which audio counts as speech.
vad_threshold = 0.5

# How often the live captions refresh, in milliseconds.
step_ms = 1000

output_dir = lectures

# Set to false for classes where recording is not allowed. Captions are still saved.
save_audio = true

# Caption a 16 kHz mono WAV recording instead of the microphone.
# input = lectures/recording.wav
