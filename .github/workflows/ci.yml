name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: brew install llvm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run scripts/bench.py selftest
      - uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.sh') }}
      - run: scripts/fetch_models.sh
      # Hosted runners give no reliable Neural Engine access, so CI covers the CPU path.
      - run: scripts/check.sh -DCLASSCAPTION_COREML=OFF
      # The pipeline shares audio across threads, so every test also runs under ThreadSanitizer.
      - run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCLASSCAPTION_COREML=OFF \
            -DCLASSCAPTION_TSAN=ON
          cmake --build build-tsan --target classcaption_tests --parallel
          ctest --test-dir build-tsan --output-on-failure
